services:
  - type: web
    name: metro-ops-backend
    runtime: node
    plan: free
    rootDir: metro-ops
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @metro-ops/shared build && pnpm --filter @metro-ops/backend build
    startCommand: corepack enable && pnpm --filter @metro-ops/backend start
    healthCheckPath: /api/ops/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OBJECT_STORE_DIR
        value: .metro-ops/uploads
      - key: DATABASE_URL
        sync: false
